name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  JWT_ACCESS_SECRET: ci-access-secret-which-is-at-least-32-chars
  JWT_REFRESH_SECRET: ci-refresh-secret-which-is-at-least-32-chars
  ACCESS_TOKEN_TTL: 15m
  REFRESH_TOKEN_DAYS: 30
  SEED_ADMIN_EMAIL: admin@adfix.local
  SEED_ADMIN_NAME: Adfix Admin
  SEED_ADMIN_PASSWORD: ChangeMe123!
  SEED_DEMO_USER_PASSWORD: DemoUser123!

jobs:
  quality:
    name: Quality, contracts, tests, and build
    runs-on: ubuntu-latest
    env:
      PGLITE_DATA_DIR: /tmp/adfix-ci-pglite
      LOCAL_UPLOAD_DIR: /tmp/adfix-ci-uploads
      ADFIX_TEST_DATA_ROOT: /tmp/adfix-ci-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Check production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Check dead code and dependency declarations
        run: npm run lint:dead-code

      - name: Typecheck API and web
        run: |
          npm run typecheck
          npm run typecheck:web

      - name: Verify generated OpenAPI contracts are current
        run: |
          npm run openapi:sync
          git diff --exit-code -- apps/api/openapi/openapi.v1.json apps/web/src/generated/api-schema.ts

      - name: Verify fresh and repeatable embedded migrations
        run: |
          npm run db:migrate
          npm run db:migrate

      - name: Run API tests with coverage thresholds
        run: npm run test:api:coverage

      - name: Run frontend tests with coverage thresholds
        run: npm run test:web:coverage

      - name: Build production artifacts
        run: npm run build

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: warn

  postgres:
    name: PostgreSQL migration and integration matrix
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adfix_pm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adfix_pm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adfix_pm
      LOCAL_UPLOAD_DIR: /tmp/adfix-postgres-uploads
      ADFIX_TEST_DATA_ROOT: /tmp/adfix-postgres-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Verify fresh and repeatable PostgreSQL migrations
        run: |
          npm run db:migrate
          npm run db:migrate

      - name: Seed PostgreSQL
        run: npm run db:seed:demo

      - name: Run API integration suite on PostgreSQL
        run: npm run test:api

  e2e:
    name: Browser acceptance and accessibility
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile journeys
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

  container:
    name: Production container smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Build and verify readiness
        run: npm run test:container
